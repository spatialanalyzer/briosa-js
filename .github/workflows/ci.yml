name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_call:
    inputs:
      upload-release-artifacts:
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build-test-package:
    name: Node build, test, and package
    strategy:
      fail-fast: false
      matrix:
        sa-target: ['2024.1.0508.5', '2026.1.0529.7']
    defaults:
      run:
        working-directory: targets/${{ matrix.sa-target }}
    runs-on: windows-latest
    timeout-minutes: 45

    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
      DOTNET_NOLOGO: 'true'

    steps:
      - name: Check out client
        uses: actions/checkout@v6

      - name: Read protocol lock
        id: protocol
        shell: pwsh
        run: |
          $lock = Get-Content protocol.lock.json -Raw | ConvertFrom-Json
          $conformance = Get-Content conformance.lock.json -Raw | ConvertFrom-Json
          if ($conformance.target.spatial_analyzer -ne $lock.target.spatial_analyzer) {
            throw "Conformance and protocol artifacts must target the same exact SA release."
          }
          "source_revision=$($lock.artifact.source_revision)" | Out-File $env:GITHUB_OUTPUT -Append
          "briosa_version=$($lock.artifact.briosa_version)" | Out-File $env:GITHUB_OUTPUT -Append
          "artifact_file_name=$($lock.artifact.file_name)" | Out-File $env:GITHUB_OUTPUT -Append
          "artifact_sha256=$($lock.artifact.sha256)" | Out-File $env:GITHUB_OUTPUT -Append
          "conformance_version=$($conformance.artifact.briosa_version)" | Out-File $env:GITHUB_OUTPUT -Append
          "conformance_file_name=$($conformance.artifact.file_name)" | Out-File $env:GITHUB_OUTPUT -Append
          "spatial_analyzer_target=$($lock.target.spatial_analyzer)" | Out-File $env:GITHUB_OUTPUT -Append

      - name: Check out pinned Briosa source
        uses: actions/checkout@v6
        with:
          repository: spatialanalyzer/briosa
          ref: ${{ steps.protocol.outputs.source_revision }}
          path: briosa-source

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24.21.0'
          cache: npm
          cache-dependency-path: targets/${{ matrix.sa-target }}/package-lock.json

      - name: Install .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: briosa-source/global.json

      - name: Install Buf
        uses: bufbuild/buf-setup-action@v1.50.0
        with:
          version: 1.72.0
          github_token: ${{ github.token }}

      - name: Install locked dependencies
        run: npm ci

      - name: Rebuild pinned protocol artifact
        shell: pwsh
        run: |
          $outputDirectory = Join-Path $PWD 'artifacts/protocol'
          ../../briosa-source/targets/${{ steps.protocol.outputs.spatial_analyzer_target }}/eng/New-ProtocolArtifact.ps1 `
            -Version "${{ steps.protocol.outputs.briosa_version }}" `
            -SourceRevision "${{ steps.protocol.outputs.source_revision }}" `
            -OutputDirectory $outputDirectory `
            -BufPath buf

      - name: Verify protocol artifact and generated drift
        shell: pwsh
        run: |
          $artifact = Join-Path artifacts/protocol "${{ steps.protocol.outputs.artifact_file_name }}"
          $hash = (Get-FileHash -LiteralPath $artifact -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($hash -ne "${{ steps.protocol.outputs.artifact_sha256 }}") {
            throw "Protocol artifact ZIP hash drifted."
          }
          node ./eng/import-protocol-artifact.mjs --artifact $artifact

      - name: Download pinned client conformance artifact
        shell: pwsh
        run: |
          $outputDirectory = Join-Path $PWD 'artifacts/conformance'
          New-Item -ItemType Directory -Path $outputDirectory -Force | Out-Null
          $releaseBase = "https://github.com/spatialanalyzer/briosa/releases/download/v${{ steps.protocol.outputs.conformance_version }}"
          $fileName = "${{ steps.protocol.outputs.conformance_file_name }}"
          Invoke-WebRequest "$releaseBase/$fileName" -OutFile (Join-Path $outputDirectory $fileName)
          Invoke-WebRequest "$releaseBase/$fileName.sha256" -OutFile (Join-Path $outputDirectory "$fileName.sha256")

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: Run shared client conformance suite
        shell: pwsh
        run: >
          ./eng/Test-Conformance.ps1
          -ArtifactPath "artifacts/conformance/${{ steps.protocol.outputs.conformance_file_name }}"
          -EvidencePath artifacts/legacy-conformance-evidence.json
          -NodeExecutable node

      - name: Test the contract-aware server from pinned source
        shell: pwsh
        run: >
          ./eng/Test-CurrentServerConformance.ps1
          -SourceTarget "${{ github.workspace }}/briosa-source/targets/${{ matrix.sa-target }}"

      - name: Retain cross-version compatibility evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: compatibility-${{ matrix.sa-target }}
          path: |
            targets/${{ matrix.sa-target }}/artifacts/legacy-conformance-evidence.json
            targets/${{ matrix.sa-target }}/artifacts/current-conformance/evidence.json
          if-no-files-found: error
          retention-days: 90

      - name: Lint
        run: npm run lint

      - name: Verify formatting
        run: npm run format:check

      - name: Verify package contents
        run: npm run pack:check

      - name: Audit runtime dependencies
        run: npm audit --omit=dev

      - name: Verify packed consumer alias
        run: npm run package:consumer

      - name: Pack release archive
        run: npm pack --pack-destination .

      - name: Test actual client package against both server generations
        shell: pwsh
        run: ./eng/Test-PackageCompatibility.ps1

      - name: Retain packaged cross-version compatibility evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: packaged-compatibility-${{ matrix.sa-target }}
          path: targets/${{ matrix.sa-target }}/artifacts/*-package-evidence.json
          if-no-files-found: error
          retention-days: 90

      - name: Retain validated release packages
        if: inputs.upload-release-artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: packages-${{ matrix.sa-target }}
          path: targets/${{ matrix.sa-target }}/*.tgz
          if-no-files-found: error
          retention-days: 30
