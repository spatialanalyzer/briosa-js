name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Package version without v; must equal both targets' package versions
        type: string
        required: true
      publish:
        description: Publish the validated packages and create a draft GitHub Release
        type: boolean
        default: false
        required: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check dispatch ref, version, existing tag, and package identities
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_PUBLISH: ${{ inputs.publish }}
        run: >
          ./eng/Test-ReleaseVersion.ps1
          -Version $env:RELEASE_VERSION
          -Ref $env:GITHUB_REF
          -Commit $env:GITHUB_SHA
          -Publish:($env:RELEASE_PUBLISH -eq 'true')

  build:
    needs: validate
    uses: ./.github/workflows/ci.yml
    with:
      upload-release-artifacts: true

  publish:
    if: inputs.publish && github.ref == 'refs/heads/main'
    needs: [validate, build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: npm
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        sa-target: ['2024.1.0508.5', '2026.1.0529.7']
    steps:
      - name: Download validated packages from this run
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: packages-${{ matrix.sa-target }}
          path: dist
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.21.0'
          package-manager-cache: false
      - name: Publish validated npm archive with GitHub OIDC
        run: npm publish ./dist/*.tgz --access public --provenance --ignore-scripts

  release:
    if: inputs.publish && github.ref == 'refs/heads/main'
    needs: [validate, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_VERSION: ${{ inputs.version }}
    steps:
      - name: Check that no release uses the tag, drafts included
        shell: bash
        run: |
          tags="$(gh api "repos/$GITHUB_REPOSITORY/releases" --paginate --jq '.[].tag_name')"
          if grep -Fxq -- "v$RELEASE_VERSION" <<< "$tags"; then
            echo "::error::A release for v$RELEASE_VERSION already exists (it may be a draft). Complete that release instead of creating another."
            exit 1
          fi
      - name: Create the draft GitHub Release
        shell: bash
        run: |
          url="$(gh release create "v$RELEASE_VERSION" --draft --target "$GITHUB_SHA" --generate-notes --title "Briosa JavaScript/TypeScript $RELEASE_VERSION")"
          {
            echo "## Draft release v$RELEASE_VERSION"
            echo
            echo "Both packages were published from \`$GITHUB_SHA\` on main. Draft: $url"
            echo
            echo "The draft has no tag yet. The maintainer verifies both registry packages in a clean consumer, completes the notes (registry links, this run, clean-consumer results), and publishes the draft, which creates the \`v$RELEASE_VERSION\` tag at that commit."
          } >> "$GITHUB_STEP_SUMMARY"
